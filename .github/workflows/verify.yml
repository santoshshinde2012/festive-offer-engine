name: Verify source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check lint, types and dependency boundaries
        run: ./verify_quality.sh
      - name: Run application tests and scenario
        run: ./run_demo.sh --run-id ci_reference
      - name: Run evidence and package tests
        run: python -m unittest discover -s tools/tests -v
