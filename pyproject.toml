[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["output", ".venv", "docs", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.pep8-naming]
# These names are the standard-library HTTP handler protocol.
ignore-names = ["do_GET", "do_POST", "setUp", "tearDown", "setUpClass", "tearDownClass"]

[tool.ruff.lint.per-file-ignores]
# Databricks injects these notebook globals; notebook cells set the library path.
"notebooks/*.py" = ["E402", "F821", "N812"]
# The portable evidence tests bootstrap the companion's import path explicitly.
"tools/tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/festive_offers"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["databricks.*", "psycopg.*"]
ignore_missing_imports = true
